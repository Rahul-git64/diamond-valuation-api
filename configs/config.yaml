project:
  name: "diamond-valuation-api"
  version: "0.1.0"

data:
  raw_data_path: "artifacts/data/raw_diamonds.csv"
  train_data_path: "artifacts/data/train_diamonds.csv"
  test_data_path: "artifacts/data/test_diamonds.csv"
  test_size: 0.2
  random_state: 42
  synthetic_rows: 1800

features:
  target_column: "price"
  numerical_columns: ["carat", "depth", "table", "x", "y", "z"]
  categorical_columns: ["cut", "color", "clarity"]
  categories:
    cut: ["Fair", "Good", "Very Good", "Premium", "Ideal"]
    color: ["J", "I", "H", "G", "F", "E", "D"]
    clarity: ["I1", "SI2", "SI1", "VS2", "VS1", "VVS2", "VVS1", "IF"]

model:
  artifacts_dir: "artifacts/models"
  preprocessor_filename: "preprocessor.joblib"
  model_filename: "model.joblib"
  metadata_filename: "metadata.json"
  reference_stats_filename: "reference_stats.json"
  r2_threshold: 0.90
  max_batch_size: 500

monitoring:
  window_size: 300
  ks_alpha: 0.05
  psi_threshold: 0.20
  categorical_l1_threshold: 0.25
