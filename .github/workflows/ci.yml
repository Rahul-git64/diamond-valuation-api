name: CI

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run unit and API integration tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container image
        run: docker build -t diamond-api:ci .

      - name: Smoke-test container health, single/batch valuation, and drift supervision
        run: |
          docker run -d --name diamond-api -p 8000:8000 diamond-api:ci
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"carat":1.15,"cut":"Ideal","color":"E","clarity":"VVS2","depth":61.8,"table":57.0,"x":6.72,"y":6.75,"z":4.16}'
          curl -fsS -X POST http://127.0.0.1:8000/predict/batch \
            -H "Content-Type: application/json" \
            -d '{"stones":[{"carat":1.15,"cut":"Ideal","color":"E","clarity":"VVS2","depth":61.8,"table":57.0,"x":6.72,"y":6.75,"z":4.16},{"carat":0.85,"cut":"Premium","color":"G","clarity":"VS1","depth":62.1,"table":58.0,"x":6.08,"y":6.11,"z":3.79}]}'
          curl -fsS http://127.0.0.1:8000/monitor/drift
          docker rm -f diamond-api
